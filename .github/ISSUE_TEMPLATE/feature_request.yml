name: Feature request
description: Suggest an improvement to document translation or usability.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the simplest useful workflow.
    validations:
      required: true
