[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forma-translate"
dynamic = ["version"]
description = "Desktop document translation that preserves the original file structure"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "FormaTranslate contributors"}]
keywords = ["document-translation", "openai", "docx", "xlsx", "pdf", "desktop", "i18n"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.28,<1",
  "lxml>=5.3,<7",
  "platformdirs>=4.3,<5",
  "python-dotenv>=1.0,<2",
  "pypdf>=6,<7",
  "keyring>=25.6,<26",
]

[project.scripts]
forma = "forma.__main__:main"

[project.gui-scripts]
forma-desktop = "forma.app:main"

[project.urls]
Homepage = "https://github.com/grebocheck/FormaTranslate"
Repository = "https://github.com/grebocheck/FormaTranslate"
Issues = "https://github.com/grebocheck/FormaTranslate/issues"
Releases = "https://github.com/grebocheck/FormaTranslate/releases"

[tool.hatch.version]
path = "src/forma/__init__.py"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "reportlab>=4,<5"]
build = ["pyinstaller>=6.14,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/forma"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
